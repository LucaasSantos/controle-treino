<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de Treino</title>
  
  <!-- Configurações PWA e iOS -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#09090b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Treino">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2964/2964514.png">

  <style>
    * { box-sizing: border-box; }

    :root {
      --bg: #09090b; 
      --card: #121214;
      --card-2: #1c1c1f;
      --border: #27272a;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --accent: #eab308;
      --accent-hover: #ca8a04;
      --success: #22c55e;
      --danger: #ef4444;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .container {
      width: min(1050px, calc(100% - 32px));
      margin: 0 auto;
      padding: 42px 0 70px;
    }

    /* --- NOVO MENU LATERAL E OVERLAY --- */
    .menu-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7); z-index: 99;
      opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
    }
    .menu-overlay.active { opacity: 1; pointer-events: auto; }

    .sidebar {
      position: fixed; top: 0; left: -320px; width: 300px; height: 100%;
      background: var(--card); border-right: 1px solid var(--border);
      z-index: 100; transition: left 0.3s ease; padding: 24px;
      display: flex; flex-direction: column; gap: 20px;
      overflow-y: auto; box-shadow: 10px 0 30px rgba(0,0,0,0.5);
    }
    .sidebar.active { left: 0; }
    
    .sidebar-header { display: flex; justify-content: space-between; align-items: center; }
    .sidebar-header h2 { font-size: 18px; color: var(--accent); margin: 0; }
    .close-btn { 
      background: none; border: none; color: var(--muted); cursor: pointer; 
      padding: 5px; display: flex; align-items: center;
    }
    .close-btn:hover { color: var(--danger); }

    .menu-btn { 
      background: none; border: none; color: var(--accent); cursor: pointer; 
      padding: 0; display: flex; align-items: center; margin-right: 12px;
    }

    .report-card { background: var(--card-2); padding: 12px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 8px; font-size: 13px; }
    .report-card div { margin-bottom: 4px; }
    .report-highlight { color: var(--accent); font-weight: 700; }
    #resultado-dados { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    /* ----------------------------------- */

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 20px;
      margin-bottom: 24px;
    }

    .header-left { display: flex; align-items: flex-start; }

    .eyebrow {
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .16em;
      margin-bottom: 7px;
    }

    h1, h2, p { margin: 0; }
    h1 { font-size: clamp(28px, 4vw, 42px); letter-spacing: -.03em; }
    .header p { color: var(--muted); margin-top: 7px; }

    .status {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      padding: 9px 12px;
      border-radius: 10px;
      font-size: 12px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 18px 50px rgba(0,0,0,.35);
    }

    .card-title {
      display: flex;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    .card-title h2 { font-size: 20px; }
    .card-title span { color: var(--muted); font-size: 13px; display: block; margin-top: 5px; }

    .top-fields {
      display: flex;
      flex-direction: row;
      gap: 14px;
      margin-bottom: 22px;
      width: 100%;
    }

    label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .08em;
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 0; 
      width: 100%;
    }

    input, select {
      width: 100%;
      min-width: 0; 
      max-width: 100%;
      margin-top: 8px;
      height: 46px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card-2);
      color: var(--text);
      padding: 0 13px;
      outline: none;
      font-size: 14px;
      font-family: inherit;
      box-sizing: border-box;
      display: block;
      -webkit-appearance: none;
      appearance: none;
      text-align: left;
    }

    /* DATA - PAZ ENTRE PC E CELULAR */
    input[type="date"] {
      display: flex;               
      align-items: center;
      justify-content: flex-start;
      position: relative;          
      background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%23a1a1aa%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Crect%20x%3D%223%22%20y%3D%224%22%20width%3D%2218%22%20height%3D%2218%22%20rx%3D%222%22%20ry%3D%222%22%3E%3C%2Frect%3E%3Cline%20x1%3D%2216%22%20y1%3D%222%22%20x2%3D%2216%22%20y2%3D%226%22%3E%3C%2Fline%3E%3Cline%20x1%3D%228%22%20y1%3D%222%22%20x2%3D%228%22%20y2%3D%226%22%3E%3C%2Fline%3E%3Cline%20x1%3D%223%22%20y1%3D%2210%22%20x2%3D%2221%22%20y2%3D%2210%22%3E%3C%2Fline%3E%3C%2Fsvg%3E");
      background-repeat: no-repeat;
      background-position: right 13px top 50%;
      background-size: 16px auto;
      padding-right: 40px; 
    }
    input[type="date"]::-webkit-datetime-edit { flex: 1; padding: 0; text-align: left; }
    input[type="date"]::-webkit-date-and-time-value { text-align: left; margin: 0; }
    input[type="date"]::-webkit-calendar-picker-indicator { position: absolute; right: 0; top: 0; width: 40px; height: 100%; opacity: 0; cursor: pointer; }

    select {
      cursor: pointer;
      background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23a1a1aa%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
      background-repeat: no-repeat;
      background-position: right 13px top 50%;
      background-size: 10px auto;
      padding-right: 30px;
    }

    input:focus, select:focus { border-color: var(--accent); }

    .exercise-list { display: grid; gap: 10px; }

    .exercise {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) 90px 110px 90px 90px;
      gap: 10px; align-items: center; padding: 13px;
      background: var(--card-2); border: 1px solid var(--border); border-radius: 12px;
    }
    .exercise-name { font-weight: 650; font-size: 14px; line-height: 1.35; }
    .exercise-target { color: var(--muted); font-size: 11px; margin-top: 4px; }
    .exercise input { margin-top: 0; height: 42px; }

    .empty {
      border: 1px dashed var(--border); border-radius: 12px; padding: 26px;
      color: var(--muted); text-align: center;
    }

    .primary {
      width: 100%; height: 48px; border: 0; border-radius: 10px; margin-top: 20px;
      background: var(--accent); color: #000; font-weight: 850; font-size: 15px;
      cursor: pointer; transition: background 0.2s ease;
    }
    .primary:hover:not(:disabled) { background: var(--accent-hover); }
    .primary:disabled { opacity: .45; cursor: not-allowed; }

    .message { min-height: 22px; margin-top: 12px; text-align: center; font-size: 13px; }
    .message.success { color: var(--success); }
    .message.error { color: var(--danger); }

    /* --- CRONÔMETRO NO TOPO --- */
    .timer-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 18px 24px; margin-bottom: 24px; display: flex; justify-content: space-between;
      align-items: center; box-shadow: 0 18px 50px rgba(0,0,0,.35);
    }
    .timer-display {
      font-size: 34px; font-weight: 800; color: var(--accent);
      font-variant-numeric: tabular-nums; transition: color 0.3s ease;
    }
    .timer-controls { display: flex; gap: 10px; }
    .timer-controls button {
      background: var(--card-2); border: 1px solid var(--border); border-radius: 50%;
      width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--muted); transition: all 0.2s;
    }
    .timer-controls button:hover, .timer-controls button:active { color: var(--accent); border-color: var(--accent); }
    .timer-controls svg { width: 20px; height: 20px; stroke: currentColor; }

    @media (max-width: 760px) {
      .header { align-items: flex-start; flex-direction: column; }
      .top-fields { flex-direction: column; } 
      .exercise { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
      .exercise-name { grid-column: 1 / -1; }
    }

    @media (max-width: 430px) {
      .container { width: 100%; padding: 22px 16px; }
      .card { padding: 16px; }
      .timer-card { padding: 16px; }
    }
  </style>
</head>
<body>
  <!-- Overlay e Menu Lateral -->
  <div class="menu-overlay" id="menu-overlay"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h2>Extrair Dados</h2>
      <button class="close-btn" id="close-menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
    
    <label>Data Início <input type="date" id="busca-inicio"></label>
    <label>Data Fim <input type="date" id="busca-fim"></label>
    
    <button id="btn-buscar-dados" class="primary" style="margin-top: 10px;">Buscar Dados</button>
    
    <div id="msg-busca" class="message"></div>
    <div id="resultado-dados"></div>
  </aside>

  <main class="container">
    <header class="header">
      <div class="header-left">
        <!-- Botão Hambúrguer adicionado aqui -->
        <button id="menu-btn" class="menu-btn" aria-label="Abrir Menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
        <div>
          <div class="eyebrow">DIÁRIO DE TREINO</div>
          <h1>Controle de Treino</h1>
          <p>Registre sua sessão e acompanhe sua evolução.</p>
        </div>
      </div>
      <div class="status" id="status">Conectando...</div>
    </header>

    <section class="timer-card">
      <div class="timer-display" id="timer-display">01:00</div>
      <div class="timer-controls">
        <button id="btn-play" aria-label="Play">
          <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
        </button>
        <button id="btn-pause" aria-label="Pause">
          <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
        </button>
        <button id="btn-reset" aria-label="Reset">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
        </button>
      </div>
    </section>

    <section class="card">
      <div class="card-title">
        <div>
          <h2>Nova sessão</h2>
          <span>Preencha os dados do treino realizado.</span>
        </div>
      </div>

      <div class="top-fields">
        <label>
          DATA
          <input type="date" id="data">
        </label>
        <label>
          TREINO
          <select id="treino">
            <option value="">Selecione o treino</option>
          </select>
        </label>
      </div>

      <div id="exercicios" class="exercise-list">
        <div class="empty">Selecione um treino para carregar os exercícios.</div>
      </div>

      <button id="registrar" class="primary" disabled>Registrar treino</button>
      <div id="mensagem" class="message"></div>
    </section>

  </main>

  <script>
    // --- LÓGICA DO PWA ---
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.log('Erro PWA:', err));
      });
    }

    const API_URL = "https://script.google.com/macros/s/AKfycbzyCZApkumifcqQOFGWx7vXMXJ-9g2ROjMgMi_qobuHaO-xtTOFNZZlrWZ9Ev7-1fsp/exec";

    // --- LÓGICA DO MENU LATERAL ---
    const menuBtn = document.getElementById("menu-btn");
    const closeMenuBtn = document.getElementById("close-menu");
    const sidebar = document.getElementById("sidebar");
    const menuOverlay = document.getElementById("menu-overlay");
    
    function toggleMenu() {
      sidebar.classList.toggle("active");
      menuOverlay.classList.toggle("active");
    }
    menuBtn.addEventListener("click", toggleMenu);
    closeMenuBtn.addEventListener("click", toggleMenu);
    menuOverlay.addEventListener("click", toggleMenu);

    // --- BUSCA DE DADOS ---
    const btnBuscarDados = document.getElementById("btn-buscar-dados");
    const msgBusca = document.getElementById("msg-busca");
    const resultadoDados = document.getElementById("resultado-dados");

    btnBuscarDados.addEventListener("click", async () => {
      const inicio = document.getElementById("busca-inicio").value;
      const fim = document.getElementById("busca-fim").value;
      
      if (!inicio || !fim) {
        msgBusca.textContent = "Preencha as duas datas.";
        msgBusca.className = "message error";
        return;
      }
      
      msgBusca.textContent = "Buscando dados...";
      msgBusca.className = "message";
      resultadoDados.innerHTML = "";
      btnBuscarDados.disabled = true;

      try {
        const url = `${API_URL}?action=getDados&inicio=${inicio}&fim=${fim}&t=${Date.now()}`;
        const response = await fetch(url);
        const data = await response.json();

        if (!data.ok) throw new Error(data.error);

        if (data.dados.length === 0) {
          msgBusca.textContent = "Nenhum dado encontrado no período.";
          msgBusca.className = "message error";
        } else {
          msgBusca.textContent = `${data.total} registros encontrados.`;
          msgBusca.className = "message success";
          
          data.dados.forEach(item => {
            const div = document.createElement("div");
            div.className = "report-card";
            div.innerHTML = `
              <div><span class="report-highlight">${item.data}</span> • ${item.treino}</div>
              <div>${item.exercicio}</div>
              <div style="color: var(--muted)">Carga: ${item.carga} | ${item.series}x${item.reps} | RIR: ${item.rir}</div>
            `;
            resultadoDados.appendChild(div);
          });
        }
      } catch (err) {
        msgBusca.textContent = `Erro: ${err.message}`;
        msgBusca.className = "message error";
      } finally {
        btnBuscarDados.disabled = false;
      }
    });

    // --- LÓGICA DA PLANILHA (REGISTRO) ---
    const treinoEl = document.getElementById("treino");
    const dataEl = document.getElementById("data");
    const exerciciosEl = document.getElementById("exercicios");
    const registrarBtn = document.getElementById("registrar");
    const mensagemEl = document.getElementById("mensagem");
    const statusEl = document.getElementById("status");

    let treinos = [];

    function hojeLocal() {
      const d = new Date();
      const offset = d.getTimezoneOffset();
      return new Date(d.getTime() - offset * 60000).toISOString().slice(0, 10);
    }
    dataEl.value = hojeLocal();
    document.getElementById("busca-inicio").value = hojeLocal();
    document.getElementById("busca-fim").value = hojeLocal();

    function showMessage(text, type = "") {
      mensagemEl.textContent = text;
      mensagemEl.className = `message ${type}`;
    }

    function popularSelectTreinos() {
      treinoEl.innerHTML = '<option value="">Selecione o treino</option>';
      treinos.forEach(t => {
        const option = document.createElement("option");
        option.value = t.nome;
        option.textContent = t.nome;
        treinoEl.appendChild(option);
      });
    }

    async function carregarTreinos() {
      if (!API_URL || API_URL.includes("COLE_AQUI")) {
        statusEl.textContent = "Configure a API";
        showMessage("Cole a URL do Apps Script no código.", "error");
        return;
      }

      const cacheLocal = localStorage.getItem("treinosCacheXAU");
      if (cacheLocal) {
        try {
          treinos = JSON.parse(cacheLocal);
          popularSelectTreinos();
          statusEl.textContent = `Carregado offline • ${treinos.length} treinos`;
        } catch (e) { console.error("Erro ao ler cache local"); }
      } else {
        statusEl.textContent = "Consultando planilha...";
      }

      try {
        const response = await fetch(`${API_URL}?action=getTreinos&t=${Date.now()}`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        if (!data.ok) throw new Error(data.error || "Erro no Apps Script.");

        treinos = Array.isArray(data.treinos) ? data.treinos : [];
        popularSelectTreinos();
        localStorage.setItem("treinosCacheXAU", JSON.stringify(treinos));

        if (treinos.length === 0) {
          statusEl.textContent = "Conectada • 0 treinos";
          showMessage('Nenhum treino encontrado na aba "INÍCIO".', "error");
          return;
        }
        statusEl.textContent = `Sincronizado • ${treinos.length} treinos`;
        showMessage("");
      } catch (error) {
        if (!cacheLocal) {
          statusEl.textContent = "Erro de conexão";
          showMessage(`Não foi possível carregar os treinos: ${error.message}`, "error");
        } else {
          statusEl.textContent = `Modo Offline • ${treinos.length} treinos`;
        }
      }
    }

    function renderExercicios(treino) {
      exerciciosEl.innerHTML = "";
      registrarBtn.disabled = true;

      if (!treino) {
        exerciciosEl.innerHTML = '<div class="empty">Selecione um treino para carregar os exercícios.</div>';
        return;
      }

      treino.exercicios.forEach((ex, index) => {
        const row = document.createElement("div");
        row.className = "exercise";
        row.dataset.index = index;

        row.innerHTML = `
          <div class="exercise-name">
            ${escapeHtml(ex.nome)}
            <div class="exercise-target">
              ${escapeHtml(ex.series)} séries • ${escapeHtml(ex.reps)} reps • RIR ${escapeHtml(ex.rir)}
            </div>
          </div>
          <input class="carga" type="number" min="0" step="0.5" placeholder="Carga" inputmode="decimal">
          <input class="series" type="number" min="1" step="1" value="${escapeHtml(ex.series)}" placeholder="Séries" inputmode="numeric">
          <input class="repeticoes" type="number" min="0" step="1" placeholder="Reps" inputmode="numeric">
          <input class="rir" type="number" min="0" step="1" placeholder="RIR" inputmode="numeric">
        `;
        exerciciosEl.appendChild(row);
      });
      registrarBtn.disabled = treino.exercicios.length === 0;
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({"&": "&amp;","<": "&lt;",">": "&gt;",'"': "&quot;","'": "&#039;"}[char]));
    }

    treinoEl.addEventListener("change", () => {
      const treino = treinos.find(t => t.nome === treinoEl.value);
      renderExercicios(treino);
    });

    registrarBtn.addEventListener("click", async () => {
      const treino = treinos.find(t => t.nome === treinoEl.value);
      if (!treino) return;

      const rows = [...document.querySelectorAll(".exercise")];
      const registros = [];

      for (const row of rows) {
        const index = Number(row.dataset.index);
        const ex = treino.exercicios[index];

        const carga = row.querySelector(".carga").value.trim();
        const series = row.querySelector(".series").value.trim();
        const repeticoes = row.querySelector(".repeticoes").value.trim();
        const rir = row.querySelector(".rir").value.trim();

        if (!carga || !series || !repeticoes || !rir) {
          showMessage(`Preencha todos os campos de "${ex.nome}".`, "error");
          return;
        }

        registros.push({
          data: dataEl.value, treino: treino.nome, exercicio: ex.nome,
          carga, series, repeticoes, rir
        });
      }

      registrarBtn.disabled = true;
      registrarBtn.textContent = "Registrando...";
      showMessage("");

      try {
        const body = new URLSearchParams({ action: "registrarTreino", payload: JSON.stringify(registros) });
        const response = await fetch(API_URL, { method: "POST", body });
        const result = await response.json();

        if (!result.ok) throw new Error(result.error || "Erro ao registrar.");

        showMessage(`${registros.length} exercícios registrados com sucesso.`, "success");
        treinoEl.value = "";             
        renderExercicios(null);          
        dataEl.value = hojeLocal();      
      } catch (error) {
        showMessage(error.message, "error");
      } finally {
        registrarBtn.disabled = false;
        registrarBtn.textContent = "Registrar treino";
      }
    });

    carregarTreinos();

    // --- LÓGICA DO CRONÔMETRO ---
    const timerDisplay = document.getElementById("timer-display");
    const btnPlay = document.getElementById("btn-play");
    const btnPause = document.getElementById("btn-pause");
    const btnReset = document.getElementById("btn-reset");

    let defaultTime = 60; 
    let timeLeft = defaultTime;
    let timerInterval = null;

    function updateTimerDisplay() {
      const minutes = Math.floor(timeLeft / 60).toString().padStart(2, "0");
      const seconds = (timeLeft % 60).toString().padStart(2, "0");
      timerDisplay.textContent = `${minutes}:${seconds}`;
    }

    btnPlay.addEventListener("click", () => {
      if (timerInterval) return; 
      timerDisplay.style.color = "var(--accent)";
      timerInterval = setInterval(() => {
        if (timeLeft > 0) {
          timeLeft--;
          updateTimerDisplay();
        } else {
          clearInterval(timerInterval);
          timerInterval = null;
          timerDisplay.style.color = "var(--success)";
          setTimeout(() => {
            timeLeft = defaultTime;
            updateTimerDisplay();
            timerDisplay.style.color = "var(--accent)";
          }, 3000); 
        }
      }, 1000);
    });

    btnPause.addEventListener("click", () => {
      clearInterval(timerInterval);
      timerInterval = null;
    });

    btnReset.addEventListener("click", () => {
      clearInterval(timerInterval);
      timerInterval = null;
      timeLeft = defaultTime;
      updateTimerDisplay();
      timerDisplay.style.color = "var(--accent)";
    });

  </script>
</body>
</html>
